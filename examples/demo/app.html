<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>pw-self-heal demo shop</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:420px;margin:40px auto;color:#1a1a18}
  .card{border:1px solid #e6e4dc;border-radius:12px;padding:24px}
  h1{font-size:20px}
  label{display:block;margin:12px 0 4px;font-size:13px;color:#555}
  input{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}
  button{margin-top:16px;padding:10px 16px;border:0;border-radius:8px;background:#1d9e75;color:#fff;font-size:14px;cursor:pointer}
  #status{margin-top:16px;color:#0f6e56;font-weight:600;min-height:20px}
  .v{position:fixed;top:8px;right:12px;font-size:12px;color:#aaa}
</style></head>
<body>
  <div class="v" id="ver"></div>
  <div class="card">
    <h1>Demo shop</h1>
    <label for="user-field">Username</label>
    <input id="user-field" type="text" placeholder="Username">
    <label for="pass-field">Password</label>
    <input id="pass-field" type="password" placeholder="Password">
    <button id="cart" data-testid="add-to-cart">Add to cart</button>
    <button id="submit" data-testid="submit">Sign in</button>
    <div id="status"></div>
  </div>
<script>
  // Simulate a UI refactor: ?v=2 renames test ids / ids / button text,
  // exactly the kind of drift that breaks selectors but not the page.
  var v = new URLSearchParams(location.search).get('v');
  document.getElementById('ver').textContent = 'v' + (v || '1');
  if (v === '2') {
    var cart = document.getElementById('cart');
    cart.setAttribute('data-testid', 'add-to-cart-btn');   // testid renamed
    var submit = document.getElementById('submit');
    submit.setAttribute('data-testid', 'submit-btn');       // testid renamed
    submit.textContent = 'Log in';                          // accessible name reworded
    document.getElementById('user-field').id = 'username-input'; // id renamed
  }
  function wire(){
    document.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        document.getElementById('status').textContent = b.textContent + ' OK';
      });
    });
  }
  wire();
</script>
</body></html>
