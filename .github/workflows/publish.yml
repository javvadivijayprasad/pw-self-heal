name: Publish to npm

# Publishes @vijaypjavvadi/pw-self-heal when a GitHub Release is published,
# or on manual dispatch. Requires an NPM_TOKEN secret (an npm automation token).
#
#   Setup once:
#     1. npmjs.com -> Access Tokens -> Generate -> "Automation"
#     2. GitHub repo -> Settings -> Secrets and variables -> Actions
#        -> New repository secret -> name: NPM_TOKEN, value: <token>
#
#   Release flow:
#     - bump "version" in package.json, commit, push
#     - create a GitHub Release with tag v<version> (e.g. v0.1.0)
#     - this workflow builds, tests, and publishes automatically

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Model presence check
        run: |
          if ls models/*.onnx >/dev/null 2>&1; then
            echo "ONNX model found — ml/hybrid modes will be available."
          else
            echo "::warning::No models/*.onnx committed — publishing heuristic-only. ml/hybrid will gracefully degrade to heuristic."
          fi

      # build + test also run via prepublishOnly; kept explicit for clear logs.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
