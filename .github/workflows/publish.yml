name: Publish to npm

# Publishes @vijaypjavvadi/pw-self-heal via npm Trusted Publishing (OIDC).
# No NPM_TOKEN secret required — GitHub Actions authenticates to npm directly.
#
# ONE-TIME SETUP (a brand-new package cannot use OIDC for its FIRST publish):
#   1. Publish v0.1.0 once from your machine:
#        npm login && npm publish
#   2. On npmjs.com open the package -> Settings -> Trusted Publishing
#      -> Add publisher (GitHub Actions):
#          Organization or user: javvadivijayprasad
#          Repository:           pw-self-heal
#          Workflow filename:    publish.yml
#          Environment:          (leave blank)
#
# AFTER THAT, every GitHub Release runs this workflow and publishes with no token.
#   - bump "version" in package.json, commit, push
#   - create a GitHub Release with tag v<version> (e.g. v0.1.1)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install
        run: npm ci || npm install

      - name: Model presence check
        run: |
          if ls models/*.onnx >/dev/null 2>&1; then
            echo "ONNX model found — ml/hybrid modes will be available."
          else
            echo "::warning::No models/*.onnx committed — publishing heuristic-only. ml/hybrid will gracefully degrade to heuristic."
          fi

      # build + test also run via prepublishOnly; kept explicit for clear logs.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Trusted publishing: no NODE_AUTH_TOKEN, and provenance is emitted by
      # default, so no --provenance flag needed.
      - name: Publish (OIDC trusted publishing)
        run: npm publish
