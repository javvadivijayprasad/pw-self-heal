name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate ONNX model
        # Ensure the trained model loads and heals a real drift (and rejects an
        # unrelated element). Installs the optional ML runtime and sets STRICT_ML
        # so the step FAILS if the model can't load (rather than silently
        # degrading to the heuristic ranker).
        env:
          STRICT_ML: "1"
        run: |
          npm install --no-save onnxruntime-node
          npm run smoke
